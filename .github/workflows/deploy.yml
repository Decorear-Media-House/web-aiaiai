name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rebuild via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_deploy \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "curl -s -X POST http://127.0.0.1:9001/rebuild"
          echo "Rebuild triggered!"
